<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Zort Game</title>
<style>
body {
  background: radial-gradient(circle, #120000, #000);
  color: white;
  text-align: center;
  font-family: Impact, Arial;
  overflow: hidden;
}

h1 {
  font-size: 70px;
  color: crimson;
  text-shadow: 0 0 30px red;
}

#game {
  position: relative;
  margin: 20px auto;
  width: 600px;
  height: 400px;
  border: 4px solid crimson;
  background: black;
  overflow: hidden;
}

/* OYUNCU */
#player {
  position: absolute;
  bottom: 10px;
  left: 260px;
  width: 80px;
  height: 20px;
  background: lime;
  box-shadow: 0 0 15px lime;
}

/* ZORTLAR */
.zort {
  position: absolute;
  top: -40px;
  width: 60px;
  height: 30px;
  background: crimson;
  color: white;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px red;
}

.info {
  color: #aaa;
}

</style>
</head>
<body>

<h1>ZORT GAME</h1>
<p>Gelen Zortlardan KAÇ!</p>

<div id="game">
  <div id="player"></div>
</div>

<h2 id="score">Skor: 0</h2>
<p class="info">← → tuşlarıyla kaç</p>

<script>const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");

let playerX = 260;
let score = 0;
let speed = 2;
let gameOver = false;

/* OYUNCU HAREKET */
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" && playerX > 0) {
    playerX -= 20;
  }
  if (e.key === "ArrowRight" && playerX < 520) {
    playerX += 20;
  }
  player.style.left = playerX + "px";
});

/* ZORT ÜRET */
function spawnZort() {
  if (gameOver) return;

  const z = document.createElement("div");
  z.className = "zort";
  z.innerText = "ZORT";
  z.style.left = Math.random() * 540 + "px";
  game.appendChild(z);

  let y = -40;

  const fall = setInterval(() => {
    if (gameOver) {
      clearInterval(fall);
      z.remove();
      return;
    }

    y += speed;
    z.style.top = y + "px";

    /* ÇARPIŞMA */
    if (
      y > 340 &&
      parseInt(z.style.left) < playerX + 80 &&
      parseInt(z.style.left) + 60 > playerX
    ) {
      gameOver = true;
      alert("💀 ZORTLANDIN!\nSkor: " + score);
      location.reload();
    }

    /* YERİ GEÇTİ */
    if (y > 400) {
      clearInterval(fall);
      z.remove();
      score++;
      scoreText.innerText = "Skor: " + score;

      if (score % 5 === 0) speed++; // zorlaşma
    }
  }, 16);
}

/* OYUN DÖNGÜ */
setInterval(spawnZort, 1000);
</script>
</body>
</html>
