<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>ZORT 3D</title>
<style>
body {
  background: radial-gradient(circle at top, #0a0000, #000);
  color: white;
  text-align: center;
  font-family: Impact, Arial;
  overflow: hidden;
  perspective: 800px; /* 3D hissin anahtarı */
}

h1 {
  font-size: 70px;
  color: crimson;
  text-shadow: 0 0 30px red;
}

#scene {
  position: relative;
  margin: 20px auto;
  width: 600px;
  height: 400px;
  background: linear-gradient(#111, #000);
  border: 4px solid crimson;
  transform-style: preserve-3d;
  transform: rotateX(15deg);
  overflow: hidden;
}

/* OYUNCU (3D BLOK) */
#player {
  position: absolute;
  bottom: 20px;
  left: 260px;
  width: 80px;
  height: 30px;
  background: linear-gradient(lime, green);
  transform: translateZ(40px);
  box-shadow:
    0 0 20px lime,
    0 20px 0 green;
}

/* 3D ZORT */
.zort {
  position: absolute;
  top: -60px;
  width: 60px;
  height: 40px;
  background: linear-gradient(crimson, darkred);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-style: preserve-3d;
  box-shadow:
    0 0 20px red,
    0 30px 0 darkred;
}

.info {
  color: #aaa;
}

</style>
</head>
<body>

<h1>ZORT 3D</h1>
<p>Gelen 3D ZORTLARDAN KAÇ!</p>

<div id="scene">
  <div id="player"></div>
</div>

<h2 id="score">Skor: 0</h2>
<p class="info">← → tuşlarıyla kaç</p>

<script>const scene = document.getElementById("scene");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");

let playerX = 260;
let score = 0;
let speed = 1.5;
let gameOver = false;

/* OYUNCU HAREKET */
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" && playerX > 0) {
    playerX -= 20;
  }
  if (e.key === "ArrowRight" && playerX < 520) {
    playerX += 20;
  }
  player.style.left = playerX + "px";
});

/* ZORT OLUŞTUR */
function spawnZort() {
  if (gameOver) return;

  const z = document.createElement("div");
  z.className = "zort";
  z.innerText = "ZORT";

  const x = Math.random() * 520;
  z.style.left = x + "px";

  /* UZAKTAN GELİYOR GİBİ */
  let y = -60;
  let zDepth = -200;

  scene.appendChild(z);

  const fall = setInterval(() => {
    if (gameOver) {
      clearInterval(fall);
      z.remove();
      return;
    }

    y += speed;
    zDepth += 5;

    z.style.top = y + "px";
    z.style.transform = `translateZ(${zDepth}px)`;

    /* ÇARPIŞMA */
    if (
      y > 300 &&
      x < playerX + 80 &&
      x + 60 > playerX
    ) {
      gameOver = true;
      alert("💀 3D ZORTLANDIN!\nSkor: " + score);
      location.reload();
    }

    /* GEÇTİ */
    if (y > 420) {
      clearInterval(fall);
      z.remove();
      score++;
      scoreText.innerText = "Skor: " + score;

      if (score % 5 === 0) speed += 0.5;
    }
  }, 16);
}

/* OYUN DÖNGÜ */
setInterval(spawnZort, 1200);
</script>
</body>
</html>
